<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Producto | Buenas Vibras</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/producto.css">
</head>

<body>

    <!-- Header generado por app.js -->
    <div id="site-header"></div>

    <main>

        <!-- Ficha del producto -->
        <section class="producto-detalle">

            <div class="container">

                <!-- Volver al catálogo -->
                <a
                    href="productos.html"
                    class="producto-volver"
                >
                    <i data-lucide="arrow-left"></i>
                    Volver al catálogo
                </a>

                <!-- Contenedor de la ficha -->
                <div
                    id="producto-detalle"
                    class="producto-ficha"
                >

                    <!-- Se completa con producto.js -->
                </div>

            </div>

        </section>

    </main>

    <!-- Footer generado por app.js -->
    <div id="site-footer"></div>

    <!-- JS general -->
    <script src="js/app.js"></script>

    <!-- JS de la ficha -->
    <script src="js/producto.js"></script>

</body>
</html>
