<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración básica -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buenas Vibras | Boutique Erótica</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Iconos SVG -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="container header-container">
            <!-- Logo -->
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="Buenas Vibras">
            </a>

            <!-- Menú -->
            <nav class="nav" id="nav">
                <ul>
                    <li><a href="#">Inicio</a></li>

                    <li class="dropdown">
                        <a href="#">Productos</a>
                        <!-- Sprint 2 -->
                    </li>

                    <li><a href="#">Nosotros</a></li>
                </ul>
            </nav>

            <!-- Acciones -->
            <div class="header-actions">
                <!-- Carrito -->
                <button class="cart-btn">
                    <i data-lucide="shopping-bag"></i>
                    <span>0</span>
                </button>

                <!-- Menú móvil -->
                <button id="menu-btn" class="menu-btn">
                    <i id="menu-icon" data-lucide="menu"></i>
                </button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-container">
            <!-- Columna izquierda -->
            <div class="hero-content">
                <span class="hero-tag">
                    Boutique Erótica
                </span>
                <h1>Descubrí nuevas experiencias.</h1>

                <p>
                    Productos seleccionados para vivir el bienestar,
                    el placer y la intimidad con libertad,
                    confianza y absoluta discreción.
                </p>

                <div class="hero-buttons">
                    <a href="#"
                    class="btn btn-primary">
                        Ver catálogo
                    </a>

                    <a href="#" class="btn btn-outline">
                        Conocenos
                    </a>
                </div>

                <!-- Beneficios -->
                <div class="hero-benefits">
                    <div>
                        <i data-lucide="package-check"></i>
                        <span>Envíos discretos</span>
                    </div>

                    <div>
                        <i data-lucide="badge-check"></i>
                        <span>Productos seleccionados</span>
                    </div>

                    <div>
                        <i data-lucide="shield-check"></i>
                        <span>Absoluta discreción</span>
                    </div>
                </div>
            </div>

            <!-- Imagen -->
            <div class="hero-image">
                <img src="img/hero/hero-home.webp" alt="Buenas Vibras">
            </div>
        </div>
    </section>

    <!--=====================================================
    SECCIONES (Sprint 2)
    ======================================================-->

    <section class="categorias"></section>

    <section class="destacados"></section>

    <section class="nosotros"></section>

    <footer>

    </footer>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
