<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración básica -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buenas Vibras | Boutique Erótica</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Iconos SVG -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/footer.css">
</head>

<body>
    <!-- Header y menú generados por app.js -->
    <div id="site-header"></div>

    <section class="hero">
        <div class="container hero-container">
            <div class="hero-image">
                <img src="img/hero/hero-home.webp" alt="Buenas Vibras">
            </div>
        </div>
    </section>

    <!--CATEGORÍAS -->
    <section class="categorias" id="categorias">
        <div class="container">
            <div class="section-heading">
                <span class="section-tag">
                    Explorá
                </span>

                <h2>
                    Encontrá lo que buscás
                </h2>

                <p>
                    Descubrí nuestra selección de productos pensados para disfrutar a tu manera.
                </p>

            </div>

            <!-- Las categorías se generan desde JSON -->
            <div class="categorias-grid" id="categorias-grid"></div>
        </div>
    </section>

    <!--PRODUCTOS DESTACADOS -->
    <section class="destacados" id="destacados">
        <div class="container">
            <div class="section-heading">
                <span class="section-tag">
                    Selección especial
                </span>

                <h2>
                    Productos destacados
                </h2>

                <p>
                    Una selección de nuestros productos favoritos.
                </p>
            </div>
            <div class="productos-grid" id="destacados-grid"></div>
        </div>
    </section>

    <!-- Footer generado por app.js -->
    <div id="site-footer"></div>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
