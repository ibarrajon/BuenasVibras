<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | Buenas Vibras</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/productos.css">
</head>

<body>

    <!-- Header generado por app.js -->
    <div id="site-header"></div>

    <main>

        <!-- Encabezado -->
        <section class="catalogo-header">
            <div class="container">

                <span class="section-tag">
                    Nuestro catálogo
                </span>

                <h1 class="titulo-seccion">
                    Productos
                </h1>

                <p>
                    Elegí la categoría que quieras explorar.
                </p>

            </div>
        </section>

        <!-- Catálogo -->
        <section class="catalogo">

            <div class="container">

                <!-- Filtros -->
                <div
                    class="categorias-filtro"
                    id="categorias-filtro">
                </div>

                <!-- Productos -->
                <div
                    class="productos-grid"
                    id="productos-grid">
                </div>

            </div>

        </section>

    </main>

    <!-- Footer generado por app.js -->
    <div id="site-footer"></div>

    <script src="js/app.js"></script>
    <script src="js/productos.js"></script>

</body>
</html>
